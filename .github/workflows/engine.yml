name: Tugyi Engine

# Publish TH / SG / US / JP live node lists for the Tugyi Pro app.
# Runs every 6 hours and on manual dispatch. A run never overwrites a
# previous output file with an empty or failed result.
#
# Hsu, 2026-11-27: make the engine faster with two engines. Two
# jobs run in parallel on separate runners (A: SG + TH, B: US + JP),
# each with its own sing-box and 10 workers, so the run takes the
# slowest job instead of the sum of all countries. The two jobs
# never push themselves: they upload their output files as
# artifacts, and one commit job collects them and pushes once, so
# two pushes can never race and lose each other's lists.
# HK was removed completely 2026-11-27 (Thai replaces it); the
# commit job deletes output/hk.txt from the repo if it is still there.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-a:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          curl -sL -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.11.0/sing-box-1.11.0-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          cp /tmp/sing-box-1.11.0-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Run engine (SG + TH)
        env:
          SING_BOX: ./sing-box
          TUGYI_MAX_TEST: "100"
          TUGYI_TOP_N: "10"
          TUGYI_WORKERS: "10"
        run: python3 engine/test_nodes.py sg th

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: engine-a
          path: output/
          if-no-files-found: error

  engine-b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          curl -sL -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.11.0/sing-box-1.11.0-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          cp /tmp/sing-box-1.11.0-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Run engine (US + JP)
        env:
          SING_BOX: ./sing-box
          TUGYI_MAX_TEST: "100"
          TUGYI_TOP_N: "10"
          TUGYI_WORKERS: "10"
        run: python3 engine/test_nodes.py us jp

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: engine-b
          path: output/
          if-no-files-found: error

  commit:
    needs: [engine-a, engine-b]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download engine outputs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Commit output if changed
        run: |
          cp artifacts/sg.txt artifacts/th.txt output/ 2>/dev/null || true
          cp artifacts/us.txt artifacts/jp.txt output/ 2>/dev/null || true
          ls -l output/
          git config user.name "tugyi-engine"
          git config user.email "tugyi-engine@users.noreply.github.com"
          git rm -q output/hk.txt 2>/dev/null || true
          git add output/sg.txt output/th.txt output/us.txt output/jp.txt
          if git diff --cached --quiet; then
            echo "No change, nothing to commit."
          else
            git commit -m "Tugyi engine: update TH/SG/US/JP live lists"
            git push
          fi
